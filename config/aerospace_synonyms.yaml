# Seed synonyms loaded into entities + entity_aliases at install time (04 §3.3 step 4).
# Owner: S5 (DCL S5 Quality), agreed with the propulsion SME. Consumer: entity normalization (S2).
#
# entities[]:
#   type       one of the closed entity types of 04 §3.2
#   canonical  English canonical name (becomes entities.canonical name)
#   aliases[]  {surface, lang}; surface copied as it appears in documents, lang is BCP-47
#              ("und" for language-neutral codes and symbols)
#   note       optional, why the seed exists
# After canonicalization (04 §3.3 step 1: NFKC, lowercase, collapse whitespace, unify dashes,
# strip trailing punctuation) no alias may point to two entities of the same type; the load
# test enforces it.
#
# Quote every surface that YAML would read as a number or boolean ("1.4404", not 1.4404);
# the load test rejects non-string surfaces.
#
# quantity_terms[]: synonyms for physical quantities (Isp, Pc). 04 §3.2 has no entity type for
# a quantity, so these are kept apart until DCL Lead decides where they load (open question
# in docs/sessions/STATUS.md). Same alias format.

