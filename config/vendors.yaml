# Vendors and publishers whose material may sit in the external library.
# Owner: S5 (DCL S5 Quality), agreed with the propulsion SME.
# Consumers: L1 source-origin and doc_kind detectors (04 §2, 03 §A1.12 step 1); vendor and
# organization entities (S2).
#
# Fields per vendor:
#   id                  stable slug
#   name                legal or common name
#   aliases[]           surface forms; an alias shorter than 4 characters must be matched
#                       case-sensitively as a whole word (case_sensitive_aliases lists them)
#   domains[]           web domains, for URL footers on datasheets
#   category            propulsion | sensors | fluidics | daq_software | materials | chemicals
#   internal_equipment  true when the team uses this vendor's equipment, so its name also
#                       appears in internal reports, run sheets and telemetry headers. A name
#                       match alone must not turn such a document external (open question in
#                       docs/sessions/STATUS.md)
#   sme_confirmed       false until the SME has reviewed the entry

