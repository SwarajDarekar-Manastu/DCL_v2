# Run from the repository root: alembic -c backend/postgres/alembic.ini upgrade head
# The database URL comes from DCL_DATABASE_URL (file 01 §7.1), never from this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
