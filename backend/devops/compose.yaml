# DCL v2 stack (docs/architecture/01 §6, 10 §3–§4). Run from the repository root:
#   docker compose --env-file .env -f backend/devops/compose.yaml [-f backend/devops/compose.dev.yaml] up -d --wait
# .env carries host-side values for operator CLIs; this file sets the in-network URLs per container, so no
# container inherits a 127.0.0.1 URL. Secrets come from ../../.env at runtime, never from an image. The GPU is
# reserved for `models` only. Worker pools mirror backend/celery_redis/queues.py (a unit test checks).
# Credentials are interpolated into URLs and must therefore be URL-safe (letters, digits, . _ ~ -).

name: dcl-v2

x-stack-env: &stack-env
  DCL_ENV: ${DCL_ENV:-dev}
  DCL_DATABASE_URL: postgresql+psycopg://${DCL_DB_USER}:${DCL_DB_PASSWORD}@postgres:5432/dcl_v2
  DCL_REDIS_URL: redis://${DCL_REDIS_PASSWORD:+:}${DCL_REDIS_PASSWORD:-}${DCL_REDIS_PASSWORD:+@}redis:6379/0
  DCL_MINIO_ENDPOINT: http://minio:9000
  DCL_MODELS_URL: http://models:8500
  DCL_OFFICE_URL: http://libreoffice:2003
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

x-backend: &backend
  image: dcl-v2-backend:local
  build:
    context: ../..
    dockerfile: backend/devops/docker/backend.Dockerfile
    target: backend
  env_file:
    - path: ${DCL_ENV_FILE:-../../.env}
      required: false
  environment: *stack-env
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully

x-worker-health: &worker-health
  interval: 60s
  timeout: 30s
  retries: 3
  start_period: 30s

services:
  postgres:
    image: paradedb/paradedb:0.26.2-pg17
    environment:
      POSTGRES_USER: ${DCL_DB_USER:-}
      POSTGRES_PASSWORD: ${DCL_DB_PASSWORD:-}
      POSTGRES_DB: dcl_v2
    ports:
      - "${DCL_DATA_BIND_HOST:-127.0.0.1}:${DCL_DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d dcl_v2"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8.6.7
    environment:
      REDIS_PASSWORD: ${DCL_REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --save 300 100 $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    ports:
      - "${DCL_DATA_BIND_HOST:-127.0.0.1}:6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: dcl-v2-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ../..
      dockerfile: backend/devops/docker/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${DCL_MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${DCL_MINIO_ROOT_PASSWORD:-}
    ports:
      - "${DCL_DATA_BIND_HOST:-127.0.0.1}:9100:9000"
      - "${DCL_BIND_HOST:-127.0.0.1}:${DCL_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: dcl-v2-backend:local
    command: ["python", "/opt/dcl/minio_init.py"]
    environment:
      DCL_MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${DCL_MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${DCL_MINIO_ROOT_PASSWORD:-}
      DCL_MINIO_ACCESS_KEY: ${DCL_MINIO_ACCESS_KEY:-}
      DCL_MINIO_SECRET_KEY: ${DCL_MINIO_SECRET_KEY:-}
      PYTHONPATH: /app
    volumes:
      - ./minio_init.py:/opt/dcl/minio_init.py:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    image: dcl-v2-backend:local
    command: ["alembic", "-c", "backend/postgres/alembic.ini", "upgrade", "head"]
    env_file:
      - path: ${DCL_ENV_FILE:-../../.env}
        required: false
    environment: *stack-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  libreoffice:
    image: dcl-v2-libreoffice:local
    build:
      context: ../..
      dockerfile: backend/devops/docker/libreoffice.Dockerfile
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2003/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'printf %s "$${DCL_ALERT_WEBHOOK_URL:-}" > /tmp/teams_webhook_url && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager'
    env_file:
      - path: ${DCL_ENV_FILE:-../../.env}
        required: false
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.11
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo "DCL_GRAFANA_ADMIN_PASSWORD is required" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${DCL_GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${DCL_BIND_HOST:-127.0.0.1}:${DCL_GRAFANA_PORT:-3300}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  console:
    image: dcl-v2-console:local
    build:
      context: ../../frontend/console
      args:
        VITE_API_BASE_URL: ${DCL_API_BASE_URL:-}
        VITE_AUTH_MODE: msal
        VITE_ENTRA_TENANT_ID: ${DCL_TENANT_ID:-}
        VITE_ENTRA_CLIENT_ID: ${DCL_CONSOLE_SPA_CLIENT_ID:-}
        VITE_ENTRA_API_SCOPE: ${DCL_CONSOLE_API_SCOPE:-}
    ports:
      - "${DCL_BIND_HOST:-127.0.0.1}:8601:80"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3
    environment:
      WEBUI_URL: ${DCL_OPENWEBUI_URL:-http://localhost:${DCL_OPENWEBUI_PORT:-8300}}
      ENABLE_OLLAMA_API: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
    ports:
      - "${DCL_BIND_HOST:-127.0.0.1}:${DCL_OPENWEBUI_PORT:-8300}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: unless-stopped

  models:
    <<: *backend
    image: dcl-v2-models:local
    build:
      context: ../..
      dockerfile: backend/devops/docker/backend.Dockerfile
      target: models
    environment:
      <<: *stack-env
      DCL_ROLE: models
    depends_on: {}
    ports:
      - "${DCL_BIND_HOST:-127.0.0.1}:8500:8500"
    volumes:
      - hf-cache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/models/health', timeout=60)"]
      interval: 30s
      timeout: 90s
      retries: 5
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]

  api:
    <<: *backend
    environment:
      <<: *stack-env
      DCL_ROLE: api
    ports:
      - "${DCL_BIND_HOST:-127.0.0.1}:8200:8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  beat:
    <<: *backend
    command: ["celery", "-A", "backend.celery_redis.app", "beat", "--loglevel", "INFO", "--schedule", "/home/app/celerybeat-schedule"]

  worker-io-light:
    <<: *backend
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "io_light@%h", "--loglevel", "INFO", "--queues", "io_light", "--pool", "threads", "--concurrency", "4", "--soft-time-limit", "300", "--time-limit", "360"]
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "celery -A backend.celery_redis.app inspect ping --timeout 10 -d io_light@$$HOSTNAME"]
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - ${DCL_TOKEN_DIR:?DCL_TOKEN_DIR is required}:${DCL_TOKEN_DIR}

  worker-cpu-parse:
    <<: *backend
    image: dcl-v2-parse:local
    build:
      context: ../..
      dockerfile: backend/devops/docker/backend.Dockerfile
      target: parse
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "cpu_parse@%h", "--loglevel", "INFO", "--queues", "cpu_parse", "--pool", "prefork", "--concurrency", "4", "--soft-time-limit", "1800", "--time-limit", "2100", "--max-memory-per-child", "6291456"]
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "celery -A backend.celery_redis.app inspect ping --timeout 10 -d cpu_parse@$$HOSTNAME"]
    deploy:
      resources:
        limits:
          memory: 24576M
    volumes:
      - hf-cache:/home/app/.cache/huggingface

  worker-telemetry-stream:
    <<: *backend
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "telemetry_stream@%h", "--loglevel", "INFO", "--queues", "telemetry_stream", "--pool", "prefork", "--concurrency", "2", "--soft-time-limit", "3600", "--time-limit", "3900", "--max-memory-per-child", "3145728"]
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "celery -A backend.celery_redis.app inspect ping --timeout 10 -d telemetry_stream@$$HOSTNAME"]
    deploy:
      resources:
        limits:
          memory: 6144M

  worker-media:
    <<: *backend
    image: dcl-v2-media:local
    build:
      context: ../..
      dockerfile: backend/devops/docker/backend.Dockerfile
      target: media
    volumes:
      - whisper-cache:/home/app/.cache/huggingface
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "media@%h", "--loglevel", "INFO", "--queues", "media", "--pool", "prefork", "--concurrency", "2", "--soft-time-limit", "3600", "--time-limit", "3900", "--max-memory-per-child", "2097152"]
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "celery -A backend.celery_redis.app inspect ping --timeout 10 -d media@$$HOSTNAME"]
    deploy:
      resources:
        limits:
          memory: 4096M

  worker-vision-batch:
    <<: *backend
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "vision_batch@%h", "--loglevel", "INFO", "--queues", "vision_batch", "--pool", "threads", "--concurrency", "2", "--soft-time-limit", "900", "--time-limit", "1000"]
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "celery -A backend.celery_redis.app inspect ping --timeout 10 -d vision_batch@$$HOSTNAME"]
    deploy:
      resources:
        limits:
          memory: 1024M

  worker-embed:
    <<: *backend
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "embed@%h", "--loglevel", "INFO", "--queues", "embed", "--pool", "threads", "--concurrency", "2", "--soft-time-limit", "600", "--time-limit", "660"]
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "celery -A backend.celery_redis.app inspect ping --timeout 10 -d embed@$$HOSTNAME"]
    deploy:
      resources:
        limits:
          memory: 2048M

  worker-benchmark:
    <<: *backend
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "benchmark@%h", "--loglevel", "INFO", "--queues", "benchmark", "--pool", "prefork", "--concurrency", "1", "--soft-time-limit", "950", "--time-limit", "1000", "--max-memory-per-child", "1572864"]
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "celery -A backend.celery_redis.app inspect ping --timeout 10 -d benchmark@$$HOSTNAME"]
    deploy:
      resources:
        limits:
          memory: 2048M

volumes:
  pgdata:
  tempo-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  redis-data:
  minio-data:
  hf-cache:
  open-webui-data:
  whisper-cache:
