# Dev overrides for the GPU workstation (docs/architecture/10 §3). Never used in staging/prod.
# - Dev-only defaults for the database and MinIO pairs when .env leaves them empty (the Lead allows them here
#   only); the application MinIO keys then default to the root pair.
# - The sync worker runs as the host user (uid 1001 on the dev host) so it can use DCL_TOKEN_DIR (mode 700).
# - Portainer (Docker UI) runs in dev only.
# - Lower concurrency and memory for cpu_parse and telemetry_stream: this host has 15 GB RAM, while the
#   production limits of file 10 §4 add up to about 38 GB.

x-dev-env: &dev-env
  DCL_ENV: dev
  DCL_DATABASE_URL: postgresql+psycopg://${DCL_DB_USER:-dcl}:${DCL_DB_PASSWORD:-dcl-dev-only}@postgres:5432/dcl_v2
  DCL_REDIS_URL: redis://${DCL_REDIS_PASSWORD:+:}${DCL_REDIS_PASSWORD:-}${DCL_REDIS_PASSWORD:+@}redis:6379/0
  DCL_MINIO_ENDPOINT: http://minio:9000
  DCL_MODELS_URL: http://models:8500
  DCL_OFFICE_URL: http://libreoffice:2003
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  DCL_MINIO_ACCESS_KEY: ${DCL_MINIO_ACCESS_KEY:-${DCL_MINIO_ROOT_USER:-dcl-dev}}
  DCL_MINIO_SECRET_KEY: ${DCL_MINIO_SECRET_KEY:-${DCL_MINIO_ROOT_PASSWORD:-dcl-dev-only-minio}}

services:
  postgres:
    environment:
      POSTGRES_USER: ${DCL_DB_USER:-dcl}
      POSTGRES_PASSWORD: ${DCL_DB_PASSWORD:-dcl-dev-only}

  minio:
    environment:
      MINIO_ROOT_USER: ${DCL_MINIO_ROOT_USER:-dcl-dev}
      MINIO_ROOT_PASSWORD: ${DCL_MINIO_ROOT_PASSWORD:-dcl-dev-only-minio}

  minio-init:
    environment:
      MINIO_ROOT_USER: ${DCL_MINIO_ROOT_USER:-dcl-dev}
      MINIO_ROOT_PASSWORD: ${DCL_MINIO_ROOT_PASSWORD:-dcl-dev-only-minio}
      DCL_MINIO_ACCESS_KEY: ${DCL_MINIO_ACCESS_KEY:-${DCL_MINIO_ROOT_USER:-dcl-dev}}
      DCL_MINIO_SECRET_KEY: ${DCL_MINIO_SECRET_KEY:-${DCL_MINIO_ROOT_PASSWORD:-dcl-dev-only-minio}}

  migrate:
    environment: *dev-env

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${DCL_GRAFANA_ADMIN_PASSWORD:-dcl-dev-only-grafana}

  models:
    environment:
      <<: *dev-env
      DCL_ROLE: models

  api:
    environment:
      <<: *dev-env
      DCL_ROLE: api

  beat:
    environment: *dev-env

  worker-io-light:
    environment: *dev-env
    user: "1001:1001"

  worker-cpu-parse:
    environment: *dev-env
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "cpu_parse@%h", "--loglevel", "INFO", "--queues", "cpu_parse", "--pool", "prefork", "--concurrency", "1", "--soft-time-limit", "3600", "--time-limit", "3900", "--max-memory-per-child", "6291456"]
    deploy:
      resources:
        limits:
          memory: 6144M

  worker-telemetry-stream:
    environment: *dev-env
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "telemetry_stream@%h", "--loglevel", "INFO", "--queues", "telemetry_stream", "--pool", "prefork", "--concurrency", "1", "--soft-time-limit", "3600", "--time-limit", "3900", "--max-memory-per-child", "3145728"]
    deploy:
      resources:
        limits:
          memory: 3072M

  worker-media:
    environment: *dev-env

  # The dev Console signs in with local passwords (DECISIONS 2026-10-22; Entra ID is future scope). The base
  # file defaults to msal, which builds a Console that cannot sign in here (S4 note, 2026-10-24).
  console:
    build:
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-local}

  worker-vision-batch:
    environment: *dev-env

  worker-embed:
    environment: *dev-env

  worker-benchmark:
    environment: *dev-env

  portainer:
    image: portainer/portainer-ce:2.45.2
    command: ["--admin-password-file", "/run/secrets/portainer_admin"]
    ports:
      - "${DCL_BIND_HOST:-127.0.0.1}:9443:9443"
      - "${DCL_BIND_HOST:-127.0.0.1}:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    secrets:
      - portainer_admin
    restart: unless-stopped

secrets:
  portainer_admin:
    environment: DCL_PORTAINER_PASSWORD

volumes:
  portainer-data:
    name: dcl-v2-portainer-data
    external: true
