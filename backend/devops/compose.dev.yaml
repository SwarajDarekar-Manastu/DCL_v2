# Dev overrides for the GPU workstation (docs/architecture/10 §3). Never used in staging/prod.
# - Host ports on 127.0.0.1 for psql, MinIO console, Redis and the models role.
# - Dev-only defaults for the database and MinIO pairs (the Lead allows them here only); the application
#   MinIO keys default to the root pair. Staging/prod set a separate MinIO service account.
# - Lower concurrency and memory for cpu_parse and telemetry_stream: this host has 15 GB RAM, while the
#   production limits of file 10 §4 add up to about 38 GB.

x-dev-env: &dev-env
  DCL_ENV: dev
  DCL_DATABASE_URL: ""
  DCL_TOKEN_DIR: /var/lib/dcl/tokens
  DCL_TOKEN_CACHE_PATH: /var/lib/dcl/tokens/msal_token_cache.bin
  DCL_DB_USER: ${DCL_DB_USER:-dcl}
  DCL_DB_PASSWORD: ${DCL_DB_PASSWORD:-dcl-dev-only}
  DCL_MINIO_ACCESS_KEY: ${DCL_MINIO_ACCESS_KEY:-${DCL_MINIO_ROOT_USER:-dcl-dev}}
  DCL_MINIO_SECRET_KEY: ${DCL_MINIO_SECRET_KEY:-${DCL_MINIO_ROOT_PASSWORD:-dcl-dev-only-minio}}

services:
  postgres:
    environment:
      POSTGRES_USER: ${DCL_DB_USER:-dcl}
      POSTGRES_PASSWORD: ${DCL_DB_PASSWORD:-dcl-dev-only}

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    environment:
      MINIO_ROOT_USER: ${DCL_MINIO_ROOT_USER:-dcl-dev}
      MINIO_ROOT_PASSWORD: ${DCL_MINIO_ROOT_PASSWORD:-dcl-dev-only-minio}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9091:9001"

  models:
    environment:
      <<: *dev-env
      DCL_ROLE: models
    ports:
      - "127.0.0.1:8500:8500"

  api:
    environment:
      <<: *dev-env
      DCL_ROLE: api

  beat:
    environment: *dev-env

  worker-io-light:
    environment: *dev-env

  worker-cpu-parse:
    environment: *dev-env
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "cpu_parse@%h", "--loglevel", "INFO", "--queues", "cpu_parse", "--pool", "prefork", "--concurrency", "2", "--soft-time-limit", "1800", "--time-limit", "2100", "--max-memory-per-child", "3145728"]
    deploy:
      resources:
        limits:
          memory: 6144M

  worker-telemetry-stream:
    environment: *dev-env
    command: ["celery", "-A", "backend.celery_redis.app", "worker", "--hostname", "telemetry_stream@%h", "--loglevel", "INFO", "--queues", "telemetry_stream", "--pool", "prefork", "--concurrency", "1", "--soft-time-limit", "3600", "--time-limit", "3900", "--max-memory-per-child", "3145728"]
    deploy:
      resources:
        limits:
          memory: 3072M

  worker-media:
    environment: *dev-env

  worker-vision-batch:
    environment: *dev-env

  worker-embed:
    environment: *dev-env
