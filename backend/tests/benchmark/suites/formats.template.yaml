# Golden formats suite: TEMPLATE (DECISIONS.md 2026-10-23, build-out first). Owner: S5.
# One to three cases per route for file formats the corpus lacks, over public samples in the git-ignored
# data/samples/web/ (sources, licenses and hashes in its SOURCES.md). Each case states what the route must
# extract; answers and citations are in data/benchmark/formats.local.yaml and are checked against the local
# sample by the suite tests (Office XML text, decoded draw.io, recomputed STL extents and TDMS maxima).
version: 1
suite: formats
cases:
  - case_id: fmt-a1-docx-table-cell
    category: FACT_LOOKUP
    question: In the illustrative tax cases document, what net cash income does the table give for Patrick in 2007?
    expected_tools: [search_documents]
    difficulty: 2
    local: true
    notes: Route A1 (DOCX) must keep the table structure so a cell is found by its row and column headers.
  - case_id: fmt-a1-pptx-table-headers
    category: FACT_LOOKUP
    question: What are the column headings of the table on the python-pptx test slide?
    expected_tools: [search_documents]
    difficulty: 1
    local: true
    notes: Route A1 (PPTX) must extract slide tables as tables, not as loose text boxes.
  - case_id: fmt-b-c-crc-algorithm
    category: CODE
    question: Which CRC algorithm function does the NASA cFE Executive Services CRC module implement, and what does it fall back to for an unimplemented CRC type?
    expected_tools: [search_documents]
    difficulty: 3
    local: true
    notes: Route B (C source) must index each function as its own node with the file context header.
  - case_id: fmt-b-matlab-leap-year
    category: CODE
    question: How does the MathWorks day-of-year example function handle leap years?
    expected_tools: [search_documents]
    difficulty: 2
    local: true
    notes: Route B (MATLAB) must index the function with its comments.
  - case_id: fmt-b-notebook-run-shortcuts
    category: CODE
    question: Which keyboard shortcuts run a cell according to the Jupyter "Running Code" example notebook?
    expected_tools: [search_documents]
    difficulty: 1
    local: true
    notes: Route B (notebook) must turn markdown and code cells into nodes; outputs are ignored.
  - case_id: fmt-c-tdms-chamber-peak
    category: TELEMETRY_MATH
    question: What is the peak chamber pressure in the synthetic hot-fire TDMS sample, and in which unit does the record state it?
    expected_tools: [query_telemetry]
    difficulty: 2
    local: true
    notes: Route C (TDMS) must take units from the channels' unit_string properties and the time base from wf_increment; no UNIT_AMBIGUITY on this file.
  - case_id: fmt-e-drawio-line-tags
    category: FACT_LOOKUP
    question: Which line tags enter or leave the auxiliary oil refining plant P&ID sample?
    expected_tools: [search_documents]
    difficulty: 2
    local: true
    notes: Route E (draw.io) must decode the compressed diagram and keep labelled components and their connections.
  - case_id: fmt-e-svg-steering-surfaces
    category: FACT_LOOKUP
    question: Which steering surfaces are labelled on the V-2 rocket cutaway diagram?
    expected_tools: [search_documents]
    difficulty: 2
    local: true
    notes: Route E (SVG) must read the text labels; the file carries English, Hindi and Hungarian labels behind a systemLanguage switch.
  - case_id: fmt-e-vsdx-connector-ends
    category: FACT_LOOKUP
    question: In the Visio connector sample, which two shapes does the connector labelled "B to C" join?
    expected_tools: [search_documents]
    difficulty: 2
    local: true
    notes: Route E (Visio) must resolve connectors to the shapes they are glued to.
  - case_id: fmt-e-dxf-layers
    category: FACT_LOOKUP
    question: Which layers does the CadQuery three-layer DXF test drawing define besides layer 0?
    expected_tools: [search_documents]
    difficulty: 1
    local: true
    notes: DXF has no route in file 03 yet; S6 decides where it lands. The layer table must be extracted.
  - case_id: fmt-g-zip-members
    category: NAVIGATIONAL
    question: Which source files does the nested public project archive contain?
    expected_tools: [search_documents]
    difficulty: 2
    local: true
    notes: Route G must extract members from nested folders as their own blobs with the archive path as breadcrumb, and skip the .DS_Store junk member at the gate.
  - case_id: fmt-g-stl-extents
    category: FACT_LOOKUP
    question: What are the overall dimensions of the NASA CubeSat top-panel 3D-printing model?
    expected_tools: [search_documents]
    difficulty: 3
    local: true
    notes: STL/STEP adapter (file 03 §11 step 6) measures the mesh with trimesh; STL carries no unit, millimetres assumed.
  - case_id: fmt-g-step-solids
    category: FACT_LOOKUP
    question: How many solid bodies does the CadQuery STEP test model contain, and what are they named?
    expected_tools: [search_documents]
    difficulty: 2
    local: true
    notes: STL/STEP adapter must list the product names of the solids.
