[project]
name = "dcl-v2"
version = "0.1.0"
description = "Document Context Layer v2: OneDrive ingestion, processing, storage and answer engine"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "matplotlib==3.10.8",
    "argon2-cffi==25.1.0",
    "llama-index-workflows==2.25.0",
    "llama-agents-dbos==0.7.0",
    "dbos==2.31.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "rapidfuzz>=3.9",
    "pyjwt[crypto]>=2.9",
    "redis>=5.0",
    "msal>=1.31",
    "cryptography>=43",
    "minio>=7.2",
    "quickxorhash>=0.3",
    "python-magic>=0.4.27",
    "celery[redis]>=5.6",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-celery>=0.66b0",
    "pgvector>=0.4",
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy>=1.26",
    "pint>=0.24",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "nptdms>=1.9",
]

[dependency-groups]
parse = [
    "pylatexenc==2.11",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-c==0.24.2",
    "tree-sitter-matlab==1.3.1",
    "defusedxml==0.7.1",
    "networkx==3.7",
    "ezdxf==1.4.4",
    "trimesh==5.1.1",
    "cascadio==0.1.1",
    "pypdfium2==5.14.0",
    "pikepdf==10.17.0",
    "docling==2.141.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "onnxruntime==1.31.0",
]
media = [
    "pillow-heif==1.8.1",
    "imagehash==4.3.2",
    "faster-whisper==1.2.1",
    # faster-whisper 1.2.1 calls av.open(metadata_errors=...), which PyAV 19 removed.
    "av==18.0.0",
]
models = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.20.2",
    "sentence-transformers==6.1.0",
    "pillow>=10",
    "numpy>=1.26",
]
dev = [
    "jsonschema>=4.23",
    "openpyxl>=3.1",
    "pillow>=11.0",
    "pint>=0.24",
    "pypdf>=5.0",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "rocketcea>=1.2",
    "ruff>=0.7",
    "pytest-asyncio>=0.24",
    "httpx2>=2.16.0",
]

[tool.uv]
conflicts = [[{ group = "models" }, { group = "parse" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "parse" }]
torchvision = [{ index = "pytorch-cpu", group = "parse" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S"]
