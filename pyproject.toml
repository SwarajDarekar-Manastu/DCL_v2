[project]
name = "dcl-v2"
version = "0.1.0"
description = "Document Context Layer v2: OneDrive ingestion, processing, storage and answer engine"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "redis>=5.0",
    "celery[redis]>=5.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pytest-asyncio>=0.24",
    "httpx2>=2.16.0",
    "pyyaml>=6.0",
]

models = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.20.2",
    "sentence-transformers==6.1.0",
    "pillow>=11.0",
    "numpy>=2.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S"]
